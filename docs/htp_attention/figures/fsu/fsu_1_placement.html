<text x="1290" y="655" class="lbl" text-anchor="start" >offset 등록</text>
<text x="80" y="900" class="sm" text-anchor="start" >nntrainer의 일반 FSU(config의 fsu: true, 층 단위로 가중치를 내렸다 올림)와는 다른 경로다. MoE 층이 expert 단위로 캐시와 선읽기를 직접 관리한다.</text>
<text x="80" y="932" class="sm" text-anchor="start" >C(층당 칸 수)는 메모리 예산이 정한다: C=16이면 아레나 1.4 GiB, 상주(C=128)면 10.8 GiB라 모바일에서 불가능.</text>
<text x="80" y="1030" class="xs" text-anchor="start" >출처: 문서 55 §3.2(크기 산술), 53 §3(LFM2 실측), 52 §10.20–10.33(선읽기 설계). 칸 그림은 한 순간의 예시 상태.</text>
