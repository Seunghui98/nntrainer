<text x="80" y="440" class="sm" text-anchor="start" >Read-ahead, LRU</text>

<text x="810" y="952" class="lbl" text-anchor="start" style="font-weight:700">0 ms</text>

<text x="1440" y="952" class="lbl" text-anchor="start" style="font-weight:700">3,360</text>
<text x="80" y="1002" class="sm" text-anchor="start" >Prefetch는 뒤 layer의 router 결과를 미리 알 수 없어 그 layer의 expert 128개를 모두 읽는다(3,360개 ≈ 10.1 GB). off는 router가 고른 expert 중 cache에 없는 것만 읽는다(1,024개).</text>
<text x="80" y="1036" class="sm" text-anchor="start" >I/O stall: off는 동기 read 시간, on은 prefetch를 기다린 시간(exposed wait).</text>
<text x="80" y="1062" class="xs" text-anchor="start" >측정: Galaxy S25 Ultra (Hexagon V79), Gemma-4 26B-A4B, 512-token prompt, MoE·FC·dense FFN NPU 구성(attention·lm_head CPU), NNTR_MOE_PREFETCH=0 / 기본값, 2026-10-07.</text>
