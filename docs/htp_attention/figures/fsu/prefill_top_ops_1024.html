<text x="80" y="1000" class="xs" text-anchor="start" >측정: Galaxy S25 Ultra (Hexagon V79), Gemma-4 26B-A4B, C=16, Q4_0 FC bin, 1024-token prompt, 2026-10-08, 브랜치 b0bbd264. 일반 빌드 prefill 타이머 6,452 ms(158.7 TPS); 프로파일 빌드는 노드마다 동기화해 합이 더 큼.</text>
<text x="80" y="1028" class="xs" text-anchor="start" >노드가 9개뿐인 이유: 이 브랜치에서 norm·RoPE·scalar·add·router·GeLU가 NPU 호출(qkv, ffn, residual_add, sparse_moe) 안으로 들어감. attention_engine: htp와 lm_head NPU는 이 실행에 없음(기기 미측정).</text>
<text x="80" y="1056" class="xs" text-anchor="start" >sparse_moe의 코드상 type은 lfm2_moe(LFM2와 공유하는 MoE 층 구현)이지만 여기서는 Gemma-4의 128 expert MoE(top-8)다.</text>
