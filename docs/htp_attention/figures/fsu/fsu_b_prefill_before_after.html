<style>

<text x="80" y="92" class="t1" text-anchor="start" >prefill: 계산하는 동안 다음 층을 미리 가져오면 기다림이 사라진다</text>
<text x="80" y="140" class="t2" text-anchor="start" >같은 프롬프트(446토큰), 같은 모델. 달라진 것은 작업대 크기(층당 칸 수) 하나다</text>
<text x="80" y="222" class="lane" text-anchor="start" style="font-size:26px">칸 5개/층</text>
<text x="80" y="256" class="h3" text-anchor="start" fill="#d03b3b">prefill 10.94 s</text>

<text x="1727.870259481038" y="243.0" class="lblw" text-anchor="middle" >층 4 계산</text>
<text x="330" y="300" class="sm" text-anchor="start" >읽기와 계산이 번갈아: 층마다 expert를 다 읽을 때까지 NPU가 논다</text>
<text x="80" y="392" class="lane" text-anchor="start" style="font-size:26px">칸 16개/층</text>

<text x="1030" y="384" class="sm" text-anchor="start" >← flash: 다음 층 것</text>
<text x="1030" y="462" class="sm" text-anchor="start" >← NPU: 쉬지 않고 계산</text>
<text x="330" y="530" class="lbl" text-anchor="start" style="font-weight:700">기다림 칸이 없다: 층 N을 계산하는 동안 층 N+1이 이미 작업대에 올라온다</text>
<text x="80" y="610" class="h3" text-anchor="start" style="font-size:26px">왜 작업대 크기가 결정적인가</text>

<text x="80" y="744" class="lbl" text-anchor="start" style="font-weight:700">칸 16개/층 = 480칸</text>

<text x="1330.0" y="742" class="lblw" text-anchor="middle" >그다음 층 가져오는 중</text>

<rect x="80" y="800" width="8" height="200" rx="4" fill="var(--crit)" />
<text x="110" y="844" class="h3" text-anchor="start" >⚠ 칸 5개/층</text>
<text x="110" y="908" class="big" text-anchor="start" >기다림 7.10 s</text>
<text x="110" y="950" class="sm" text-anchor="start" >flash에서 기다리며 읽은 expert 2,893개</text>
<rect x="680" y="800" width="560" height="200" rx="10" fill="#fff" style="stroke:var(--ring);stroke-width:2"/>
<rect x="680" y="800" width="8" height="200" rx="4" fill="var(--npu)" />
<text x="710" y="844" class="h3" text-anchor="start" >칸 16개/층 (기본)</text>
<text x="710" y="908" class="big" text-anchor="start" >기다림 0.01 s</text>
<text x="710" y="950" class="sm" text-anchor="start" >미리 가져온 expert 3,360개</text>
<rect x="1280" y="800" width="560" height="200" rx="10" fill="#fff" style="stroke:var(--ring);stroke-width:2"/>
<rect x="1280" y="800" width="8" height="200" rx="4" fill="var(--muted)" />
<text x="1310" y="844" class="h3" text-anchor="start" >그래도 남는 바닥</text>
<text x="1310" y="908" class="big" text-anchor="start" >≈ 3.3 s</text>
<text x="1310" y="950" class="sm" text-anchor="start" >prefill마다 약 10 GB를 3.0 GB/s로 읽는다 (산술)</text>
<text x="80" y="1050" class="xs" text-anchor="start" >실측: Galaxy S25 Ultra, MoE만 NPU 구성, 2026-10-02 (문서 55 §10.11). 막대는 개념도이고 두 줄의 길이 비만 실측(10.94 : 5.01)에 맞췄다. 모든 연산 NPU 구성은 기기 미측정.</text>
