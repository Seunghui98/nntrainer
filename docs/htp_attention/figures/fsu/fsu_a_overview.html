<text x="80" y="318" class="h3" text-anchor="start" >작업대에 올라가는 양 = 480칸 ≈ 1.4 GB (12%)</text>
<rect x="80" y="334" width="212.41379310344828" height="54" rx="4" fill="var(--npu)" />
<text x="308.41379310344826" y="370" class="lbl" text-anchor="start" >← 나머지 88%는 필요할 때 창고에서 가져온다</text>
<rect x="80" y="440" width="520" height="250" rx="14" fill="var(--read-t)" />
<text x="112" y="500" class="big" text-anchor="start" style="font-size:40px">창고</text>
<text x="210" y="498" class="lane2" text-anchor="start" style="font-size:20px">Flash (UFS)</text>
<text x="112" y="560" class="lbl" text-anchor="start" style="font-size:24px">모든 expert가 있다</text>
<text x="112" y="600" class="lbl" text-anchor="start" style="font-size:24px">크지만 느리다: 3.0 GB/s</text>
<rect x="700" y="440" width="520" height="250" rx="14" fill="#e6eef9" />
<text x="732" y="500" class="big" text-anchor="start" style="font-size:40px">작업대</text>

<text x="732" y="560" class="lbl" text-anchor="start" style="font-size:24px">지금 쓰는 것 + 곧 쓸 것</text>
<text x="732" y="600" class="lbl" text-anchor="start" style="font-size:24px">빈 칸은 다 쓴 것부터 비운다</text>
<rect x="1320" y="440" width="520" height="250" rx="14" fill="var(--npu-t)" />
<text x="1352" y="500" class="big" text-anchor="start" style="font-size:40px">작업자</text>
<text x="1490" y="498" class="lane2" text-anchor="start" style="font-size:20px">NPU (Hexagon)</text>
<text x="1352" y="560" class="lbl" text-anchor="start" style="font-size:24px">작업대 위의 expert만</text>
<text x="1352" y="600" class="lbl" text-anchor="start" style="font-size:24px">가지고 계산한다</text>
<path d="M604,565 L692,565" stroke="#eb6834" stroke-width="5" marker-end="url(#ahr)"/>
<text x="650" y="540" class="sm" text-anchor="middle" >가져오기</text>
<path d="M1224,565 L1312,565" stroke="#52514e" stroke-width="5" marker-end="url(#ah)"/>
<text x="1270" y="540" class="sm" text-anchor="middle" >계산</text>
<rect x="80" y="740" width="860" height="250" rx="14" fill="#fff" style="stroke:var(--ring);stroke-width:2"/>
<rect x="80" y="740" width="10" height="250" rx="4" fill="var(--npu)" />
<text x="118" y="792" class="h3" text-anchor="start" style="font-size:26px">prefill (프롬프트 읽기)</text>
<text x="118" y="842" class="lbl" text-anchor="start" style="font-size:22px">무엇이 필요한지 미리 안다 (층마다 거의 전부)</text>
<text x="118" y="882" class="lbl" text-anchor="start" style="font-size:22px;font-weight:700">→ 계산하는 동안 다음 층 것을 미리 가져온다</text>
<text x="118" y="930" class="sm" text-anchor="start" >기다림 7.10 s → 0.01 s (실측, 칸 5 → 16개/층)</text>
<rect x="980" y="740" width="860" height="250" rx="14" fill="#fff" style="stroke:var(--ring);stroke-width:2"/>
<rect x="980" y="740" width="10" height="250" rx="4" fill="var(--read)" />
<text x="1018" y="792" class="h3" text-anchor="start" style="font-size:26px">decode (한 토큰씩 생성)</text>
<text x="1018" y="842" class="lbl" text-anchor="start" style="font-size:22px">라우터가 고르기 전에는 모른다 (128개 중 8개)</text>
<text x="1018" y="882" class="lbl" text-anchor="start" style="font-size:22px;font-weight:700">→ 쓴 것을 작업대에 남겨 두고, 없으면 그때 가져온다</text>
<text x="1018" y="930" class="sm" text-anchor="start" >작업대에 있을 확률(히트율)이 속도를 정한다</text>
<text x="80" y="1040" class="xs" text-anchor="start" >nntrainer의 일반 FSU(층 단위 swap)가 아니라 MoE 층이 expert 단위로 관리하는 경로. 크기는 문서 55 §3.2 산술, 기다림은 55 §10.11 실측(MoE만 NPU 구성, 2026-10-02).</text>
