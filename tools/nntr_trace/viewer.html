<title>nntr trace</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* chrome://tracing look: dense rows, pastel slices, black slice text, gray chrome */
:root {
  --bg: #ffffff; --chrome: #f3f3f3; --chrome-2: #e8e8e8; --line: #d0d0d0; --grid: #ececec;
  --ink: #202020; --ink-2: #555; --ink-3: #888; --sel: #000; --slice-ink: #000;
  --ruler: #f9f9f9; --proc: #dfe6ee; --tip-bg: #ffffe1; --tip-ink: #000; --tip-line: #999;
  --accent: #1a73e8; --ovl: rgba(26,115,232,.12);
  --cpu: #7fb3e0; --hmx: #f0a080; --hvx: #8fd4b0; --rpc: #f2d472; --dma: #b0a8e0; --sync: #cfcfcf; --frame: #9a9a9a; --wait: #f2d472; --load: #bdbdbd;
  --serious: #d9822b; --critical: #c5221f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1e1e; --chrome: #2b2b2b; --chrome-2: #333; --line: #444; --grid: #2a2a2a;
    --ink: #e6e6e6; --ink-2: #b5b5b5; --ink-3: #8a8a8a; --sel: #fff; --slice-ink: #111;
    --ruler: #262626; --proc: #33404d; --tip-bg: #3a3a30; --tip-ink: #f0f0e0; --tip-line: #666;
    --accent: #8ab4f8; --ovl: rgba(138,180,248,.15);
    --serious: #f0a35a; --critical: #f28b82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1e1e; --chrome: #2b2b2b; --chrome-2: #333; --line: #444; --grid: #2a2a2a;
  --ink: #e6e6e6; --ink-2: #b5b5b5; --ink-3: #8a8a8a; --sel: #fff; --slice-ink: #111;
  --ruler: #262626; --proc: #33404d; --tip-bg: #3a3a30; --tip-ink: #f0f0e0; --tip-line: #666;
  --accent: #8ab4f8; --ovl: rgba(138,180,248,.15);
  --serious: #f0a35a; --critical: #f28b82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 12px/1.35 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; display: flex; flex-direction: column; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
/* toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 5px 12px; background: var(--chrome); border-bottom: 1px solid var(--line); }
.bar .title { font-weight: 600; font-size: 13px; margin-right: 6px; }
.bar .sub { color: var(--ink-3); font-size: 11px; }
.bar .sp { flex: 1; }
select, input[type=text], button, label.file { font: inherit; font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; height: 24px; }
button:hover, label.file:hover { cursor: pointer; background: var(--chrome-2); }
button:focus-visible, select:focus-visible, input:focus-visible, label.file:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
label.file { display: inline-flex; align-items: center; }
label.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
/* timeline */
.tl { position: relative; flex: 1 1 auto; min-height: 260px; overflow: auto; background: var(--bg); }
.tl canvas { display: block; touch-action: none; }
#tip { position: fixed; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); border: 1px solid var(--tip-line); font-size: 11px; padding: 4px 6px; max-width: 380px; z-index: 5; white-space: pre; font-family: ui-monospace, Menlo, Consolas, monospace; }
/* analysis panel */
.panel { flex: 0 0 auto; height: 300px; min-height: 120px; max-height: 60vh; resize: vertical; overflow: auto; border-top: 1px solid var(--line); background: var(--bg); }
.tabs { display: flex; gap: 0; background: var(--chrome); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
.tabs button { border: 0; border-right: 1px solid var(--line); border-radius: 0; height: 24px; background: transparent; padding: 0 12px; }
.tabs button[aria-selected="true"] { background: var(--bg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.tabs .st { margin-left: auto; padding: 0 12px; color: var(--ink-3); align-self: center; font-size: 11px; }
.pane { padding: 8px 12px; }
table { border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 3px 10px 3px 4px; border-bottom: 1px solid var(--grid); white-space: nowrap; vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; background: var(--chrome); position: sticky; top: 24px; }
td.n, th.n { text-align: right; font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
td.k { color: var(--ink-2); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--chrome); }
.sw { display: inline-block; width: 10px; height: 10px; border: 1px solid rgba(0,0,0,.25); vertical-align: -1px; margin-right: 5px; }
.stack { display: inline-flex; height: 12px; width: 100%; max-width: 520px; border: 1px solid var(--line); overflow: hidden; vertical-align: middle; }
.stack i { display: block; height: 100%; }
.pill { font-size: 11px; padding: 0 5px; border: 1px solid; border-radius: 2px; }
.pill.bad { color: var(--serious); } .pill.crit { color: var(--critical); }
.hint { color: var(--ink-3); font-size: 11px; }
@media (max-width: 640px) { .panel { height: 220px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="bar">
  <span class="title">nntr trace</span><span class="sub" id="subtitle"></span>
  <span class="sp"></span>
  <select id="trace-select" aria-label="Trace"></select>
  <label class="file">Load<input type="file" id="file" accept=".json,application/json"></label>
  <select id="color-select" aria-label="Color slices by">

  <input type="text" id="search" placeholder="Find (name / op / layer)" aria-label="Find">
  <button id="reset" type="button" title="Fit (0)">Fit</button>

</div>
<div class="tl" id="tl"><canvas id="cv"></canvas></div>
<div class="panel" id="panel">
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="sel" aria-selected="true">Selection</button>
    <button role="tab" data-tab="wall" aria-selected="false">Wall time</button>
    <button role="tab" data-tab="eng" aria-selected="false">Engines</button>
    <button role="tab" data-tab="ker" aria-selected="false">Kernels</button>

  </div>
  <div class="pane" id="pane"></div>
</div>
<div id="tip" hidden></div>

<script id="embedded-traces" type="application/json">{}</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CAT = {
  'host.cpu': 'cpu', 'host.rpc': 'rpc', 'host.wait': 'wait', 'host.layer': 'frame', 'host.phase': 'frame', 'host.load': 'load',
  'dsp.hmx': 'hmx', 'dsp.hvx': 'hvx', 'dsp.dma': 'dma', 'dsp.sync': 'sync', 'dsp.call': 'frame', 'dsp.entry': 'frame', 'qnn.op': 'cpu',
};
// catapult's general-purpose slice palette (color_scheme.html paletteBase), as chrome://tracing draws them
const PALETTE = ['rgb(138,113,152)','rgb(175,112,133)','rgb(127,135,225)','rgb(93,163,141)','rgb(115,138,126)','rgb(153,119,131)','rgb(93,155,213)','rgb(116,164,166)','rgb(202,134,113)','rgb(144,139,149)','rgb(155,130,150)','rgb(105,160,167)','rgb(106,151,204)','rgb(133,147,153)','rgb(120,131,206)','rgb(88,152,203)','rgb(131,134,195)','rgb(112,158,150)','rgb(90,153,138)','rgb(93,149,194)'];
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };

const cv = $('#cv'), ctx = cv.getContext('2d'), tl = $('#tl');
const ROW = 17, HDR = 22, LABEL_W = 170, PROC_H = 18, CTR_H = 30;
const FONT = '11px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

// ---------- parse ----------
function parse(doc) {

  const procs = new Map();

  const TH = (pid, tid) => { const p = P(pid); return p.threads.get(tid) || (p.threads.set(tid, { pid, tid, name: 'tid ' + tid, sort: tid, ev: [], depth: 1 }), p.threads.get(tid)); };

      else if (e.name === 'process_sort_index') P(e.pid).sort = e.args.sort_index;
      else if (e.name === 'thread_name') TH(e.pid, e.tid).name = e.args.name;
      else if (e.name === 'thread_sort_index') TH(e.pid, e.tid).sort = e.args.sort_index;

      const th = TH(e.pid, e.tid); th._as = th._as || new Map();

      const f = flows.get(e.id) || (flows.set(e.id, {}), flows.get(e.id)); f[e.ph] = e;

      const key = e.pid + ':' + e.name;

    th.ev.sort((a, b) => a.ts - b.ts || b.dur - a.dur);

    for (const e of th.ev) {
      while (st.length && st[st.length - 1].ts + st[st.length - 1].dur <= e.ts + 1e-6) st.pop();

  return { procs: plist, rows, height: y + 6, tmin, tmax, flows: [...flows.values()].filter(f => f.s && f.f), counters: [...counters.values()], md: doc.metadata || {}, phases, all };
}

// ---------- interval math ----------
function union(iv) { iv = iv.filter(x => x[1] > x[0]).sort((a, b) => a[0] - b[0]); const o = []; for (const x of iv) { const l = o[o.length - 1]; if (l && x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else o.push([x[0], x[1]]); } return o; }
const len = iv => iv.reduce((s, x) => s + x[1] - x[0], 0);
function inter(a, b) { const o = []; let i = 0, j = 0; while (i < a.length && j < b.length) { const lo = Math.max(a[i][0], b[j][0]), hi = Math.min(a[i][1], b[j][1]); if (hi > lo) o.push([lo, hi]); if (a[i][1] < b[j][1]) i++; else j++; } return o; }

const clip = (e, r) => [Math.max(e.ts, r.t0), Math.min(e.ts + e.dur, r.t1)];
const spans = (pred, r) => union(T.all.filter(e => pred(e) && e.ts < r.t1 && e.ts + e.dur > r.t0).map(e => clip(e, r)));
const fmt = us => us >= 1000 ? (us / 1000).toFixed(3) + ' ms' : us.toFixed(3) + ' µs';
const pct = x => (x * 100).toFixed(1) + '%';

function metrics(r) {
  const wall = r.t1 - r.t0;
  const hmx = spans(e => e.cat === 'dsp.hmx', r), hvx = spans(e => e.cat === 'dsp.hvx', r), dma = spans(e => e.cat === 'dsp.dma', r);
  const entry = spans(e => e.cat === 'dsp.entry', r), any = union([...hmx, ...hvx, ...dma]);
  const rpc = spans(e => e.cat === 'host.rpc', r), cpu = spans(e => e.cat === 'host.cpu', r), load = spans(e => e.cat === 'host.load', r);
  const overlap = inter(hmx, hvx), idle = minus(entry, any);
  const other = wall - len(union([...cpu, ...rpc, ...any, ...idle, ...load]));
  const occ = [];
  for (const p of T.procs) for (const th of p.tlist) {
    const c = th.ev.find(e => ['dsp.hmx', 'dsp.hvx', 'dsp.dma', 'host.cpu'].includes(e.cat)); if (!c) continue;
    occ.push({ th, cat: c._cat, busy: len(spans(e => e._th === th && ['dsp.hmx', 'dsp.hvx', 'dsp.dma', 'host.cpu'].includes(e.cat), r)) / wall });
  }
  return { wall, cpu: len(cpu), rpc: len(rpc), hmxOnly: len(minus(hmx, hvx)), hvxOnly: len(minus(hvx, hmx)), overlap: len(overlap), dmaOnly: len(minus(dma, union([...hmx, ...hvx]))), idle: len(idle), load: len(load), other: Math.max(0, other), any: len(any), entry: len(entry), compression: len(any) ? (len(hmx) + len(hvx) + len(dma)) / len(any) : 0, occ };
}
function kernels(r) {
  const m = new Map(), mhz = T.md.dsp_clock_mhz || 1200;
  for (const e of T.all) {
    if (!e.args || !e.args.engine || !e.args.elems || !['dsp.hmx', 'dsp.hvx'].includes(e.cat) || e.ts >= r.t1 || e.ts + e.dur <= r.t0) continue;
    const k = e.args.engine + '|' + e._label, row = m.get(k) || (m.set(k, { engine: e.args.engine, name: e._label, n: 0, us: 0, elems: 0, cyc: 0 }), m.get(k));
    row.n++; row.us += e.dur; row.elems += e.args.elems; row.cyc += e.args.cycles || 0;
  }
  return [...m.values()].map(k => ({ ...k, cpe: (k.cyc || k.us * mhz) / k.elems })).sort((a, b) => b.us - a.us);
}

// ---------- colors ----------
function sliceColor(e) {
  if (colorBy === 'engine') return css('--' + (e._cat === 'frame' ? 'frame' : e._cat));
  return PALETTE[hash(colorBy === 'op' ? e._op : e.name) % PALETTE.length];
}

// ---------- draw ----------
function resize() {
  const w = tl.clientWidth || 800, dpr = window.devicePixelRatio || 1;
  cv.style.width = w + 'px'; cv.style.height = T.height + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(T.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function niceStep(span, px) { const t = span / (px / 100), p = Math.pow(10, Math.floor(Math.log10(t))); for (const m of [1, 2, 5, 10]) if (m * p >= t) return m * p; return 10 * p; }
function fitText(s, w) {

  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ctx.measureText(s.slice(0, mid) + '…').width <= w) lo = mid; else hi = mid - 1; }
  return lo > 0 ? s.slice(0, lo) + '…' : '';
}
function drawGutter(W, H) {
  ctx.fillStyle = css('--chrome'); ctx.fillRect(0, HDR, LABEL_W - 1, H - HDR);
  for (const row of T.rows) {
    if (row.kind === 'proc') { ctx.fillStyle = css('--proc'); ctx.fillRect(0, row.y, W, row.h); ctx.fillStyle = css('--ink'); ctx.font = 'bold ' + FONT; ctx.fillText('▾ ' + row.p.name + ' (pid ' + row.p.pid + ')', 6, row.y + row.h / 2); ctx.font = FONT; }
    else if (row.kind === 'ctr') { ctx.fillStyle = css('--ink-2'); ctx.fillText(row.c.name, 14, row.y + row.h / 2); }
    else { ctx.fillStyle = css('--ink-2'); ctx.fillText(fitText(row.th.name + ' (' + row.th.tid + ')', LABEL_W - 20), 14, row.y + row.h / 2); }
  }

    const rel = t - T.tmin; ctx.fillStyle = css('--ink-2'); ctx.fillText(ms ? (rel / 1000).toFixed(step >= 1000 ? 0 : 2) + ' ms' : rel.toFixed(0) + ' µs', x + 3, HDR / 2 - 2);

  ctx.strokeStyle = css('--line'); ctx.beginPath(); ctx.moveTo(0, HDR - .5); ctx.lineTo(W, HDR - .5); ctx.stroke();
  const q = filter.toLowerCase();
  const matches = e => !q || e._label.toLowerCase().includes(q) || (e.args && Object.values(e.args).some(v => String(v).toLowerCase().includes(q)));

    if (row.kind === 'proc') continue;
    if (row.kind === 'ctr') {
      const pts = row.c.pts, mx = Math.max(1, ...pts.map(p => p[1]));
      ctx.fillStyle = PALETTE[hash(row.c.name) % PALETTE.length];
      for (let i = 0; i < pts.length; i++) {
        const t0 = pts[i][0], t1 = i + 1 < pts.length ? pts[i + 1][0] : view.t1; if (t1 < view.t0 || t0 > view.t1) continue;
        const x0 = Math.max(LABEL_W, X(t0)), x1 = Math.min(W, X(t1)), h = (row.h - 6) * pts[i][1] / mx;
        ctx.fillRect(x0, row.y + row.h - 3 - h, Math.max(1, x1 - x0), h);
      }
      ctx.strokeStyle = css('--grid'); ctx.beginPath(); ctx.moveTo(LABEL_W, row.y + row.h - .5); ctx.lineTo(W, row.y + row.h - .5); ctx.stroke();
      continue;
    }
    const th = row.th;
    ctx.strokeStyle = css('--grid'); ctx.beginPath(); ctx.moveTo(LABEL_W, row.y + row.h - .5); ctx.lineTo(W, row.y + row.h - .5); ctx.stroke();
    for (const e of th.ev) {
      if (e.ts > view.t1 || e.ts + e.dur < view.t0) continue;
      const x0 = X(e.ts), x1 = X(e.ts + e.dur), w = x1 - x0; if (w < .3) continue;
      const y = row.y + 1 + e._d * ROW, h = ROW - 1, xa = Math.max(LABEL_W, x0), xb = Math.min(W, x1);
      const dim = q && !matches(e);
      ctx.globalAlpha = dim ? .25 : 1;
      ctx.fillStyle = sliceColor(e);
      const isFrame = e._cat === 'frame' || e._cat === 'wait';
      if (isFrame && colorBy === 'engine') { ctx.globalAlpha *= .35; ctx.fillRect(xa, y, Math.max(1, xb - xa - (w > 2 ? 1 : 0)), h); ctx.globalAlpha = dim ? .25 : 1; ctx.strokeStyle = sliceColor(e); ctx.strokeRect(xa + .5, y + .5, Math.max(1, xb - xa - 1), h - 1); }
      else ctx.fillRect(xa, y, Math.max(1, xb - xa - (w > 2 ? 1 : 0)), h);
      if (e === selected) { ctx.strokeStyle = css('--sel'); ctx.lineWidth = 2; ctx.strokeRect(xa + 1, y + 1, Math.max(1, xb - xa - 2), h - 2); ctx.lineWidth = 1; }
      if (xb - xa > 14) { ctx.fillStyle = css('--slice-ink'); const s = fitText(e._label, xb - xa - 6); if (s) ctx.fillText(s, xa + 3, y + h / 2); }
      ctx.globalAlpha = 1;
    }
  }
  if (k > 0.002) {
    ctx.strokeStyle = css('--ink-2'); ctx.fillStyle = css('--ink-2'); ctx.lineWidth = 1; ctx.globalAlpha = .8;
    for (const f of T.flows) {
      const a = f.s, b = f.f; if (b.ts < view.t0 || a.ts > view.t1) continue;
      const ta = T.procs.find(p => p.pid === a.pid)?.threads.get(a.tid), tb = T.procs.find(p => p.pid === b.pid)?.threads.get(b.tid); if (!ta || !tb) continue;
      const x0 = X(a.ts), y0 = ta._y + ROW / 2 + 1, x1 = X(b.ts), y1 = tb._y + ROW / 2 + 1;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.bezierCurveTo(x0 + 16, y0, x1 - 16, y1, x1, y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - 5, y1 - 3); ctx.lineTo(x1 - 5, y1 + 3); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  drawGutter(W, H);
}

// ---------- analysis panel ----------
const swatch = e => `<span class="sw" style="background:${sliceColor(e)}"></span>`;
function renderPane() {
  const r = range, m = metrics(r), pane = $('#pane');
  $('#range-label').textContent = `${r.label} · ${fmt(m.wall)}`;
  for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', b.dataset.tab === tab);
  const bg = p => p[0] === 'ovl' ? 'repeating-linear-gradient(135deg,var(--hmx) 0 4px,var(--hvx) 4px 8px)' : 'var(--' + p[0] + ')';
  if (tab === 'sel') {
    const e = selected;
    if (!e) { pane.innerHTML = '<span class="hint">Nothing selected. Click a slice.</span>'; return; }
    const a = e.args || {}, mhz = T.md.dsp_clock_mhz || 1200;
    const rows = [['Title', swatch(e) + e._label], ['Category', e.cat], ['Track', `${e._th.name} · pid ${e.pid} tid ${e.tid}`], ['Start', fmt(e.ts - T.tmin)], ['Wall Duration', fmt(e.dur)]];
    if (a.elems) rows.push(['cycles / element', (a.cycles ? a.cycles / a.elems : e.dur * mhz / a.elems).toFixed(3) + (a.cycles ? '' : ' (est. from ' + mhz + ' MHz)')]);
    const same = T.all.filter(x => x._label === e._label), tot = same.reduce((s, x) => s + x.dur, 0);
    rows.push(['Occurrences', `${same.length} · total ${fmt(tot)} · mean ${fmt(tot / same.length)}`]);
    pane.innerHTML = `<table>${rows.map(([k, v]) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`).join('')}</table>` +
      (Object.keys(a).length ? `<div style="margin-top:8px"><b>Args</b><table>${Object.entries(a).map(([k, v]) => `<tr><td class="k">${k}</td><td class="mono">${v}</td></tr>`).join('')}</table></div>` : '');
  } else if (tab === 'wall') {
    const parts = [['cpu', 'CPU (host)', m.cpu], ['rpc', 'FastRPC seam', m.rpc], ['hmx', 'HMX only', m.hmxOnly], ['ovl', 'HMX ∥ HVX', m.overlap], ['hvx', 'HVX only', m.hvxOnly], ['dma', 'DMA only', m.dmaOnly], ['sync', 'DSP idle', m.idle], ['load', 'weight load', m.load], ['frame', 'other / gaps', m.other]].filter(p => p[2] > 0);
    pane.innerHTML = `<div class="stack">${parts.map(p => `<i title="${p[1]} ${fmt(p[2])}" style="width:${p[2] / m.wall * 100}%;background:${bg(p)}"></i>`).join('')}</div>
      <table style="margin-top:8px"><tr><th></th><th>bucket</th><th class="n">time</th><th class="n">share</th></tr>${parts.map(p => `<tr><td><span class="sw" style="background:${bg(p)}"></span></td><td>${p[1]}</td><td class="n">${fmt(p[2])}</td><td class="n">${pct(p[2] / m.wall)}</td></tr>`).join('')}
      <tr><td></td><td>parallel compression</td><td class="n">${m.compression.toFixed(2)}×</td><td class="k">Σ(HMX+HVX+DMA busy) ÷ DSP wall · QNN optrace 4.1×</td></tr>
      <tr><td></td><td>idle inside DSP calls</td><td class="n">${pct(m.entry ? m.idle / m.entry : 0)}</td><td class="k">QNN 0.09 %</td></tr></table>`;
  } else if (tab === 'eng') {
    pane.innerHTML = `<table><tr><th>track</th><th style="width:320px">busy</th><th class="n">%</th></tr>${m.occ.map(o => `<tr><td>${o.th.name}</td><td><span class="stack" style="max-width:320px;height:10px"><i style="width:${o.busy * 100}%;background:var(--${o.cat})"></i></span></td><td class="n">${pct(o.busy)}</td></tr>`).join('')}</table>`;
  } else if (tab === 'ker') {
    const ks = kernels(r);
    pane.innerHTML = `<table><tr><th>engine</th><th>kernel (op: name)</th><th class="n">calls</th><th class="n">total</th><th class="n">mean</th><th class="n">elems</th><th class="n">cy/elem</th><th></th></tr>` +
      ks.slice(0, 30).map(k => `<tr class="click" data-k="${k.name.replace(/"/g, '&quot;')}"><td>${k.engine}</td><td>${k.name}</td><td class="n">${k.n}</td><td class="n">${fmt(k.us)}</td><td class="n">${fmt(k.us / k.n)}</td><td class="n">${k.elems.toExponential(2)}</td><td class="n">${k.cpe.toFixed(3)}</td><td>${k.cpe > 1 ? '<span class="pill crit">pathological</span>' : k.cpe > 0.5 ? '<span class="pill bad">outlier</span>' : ''}</td></tr>`).join('') +
      `</table><p class="hint">cy/elem = Σcycles ÷ Σelems (args.cycles, else dur × ${T.md.dsp_clock_mhz || 1200} MHz). QNN optrace: HMX 0.01–0.06, HVX elementwise 0.07–0.10, softmax 0.24, pathological 1.52.</p>`;
    for (const tr of pane.querySelectorAll('tr.click')) tr.onclick = () => { filter = tr.dataset.k.split(': ').pop(); $('#search').value = filter; draw(); };
  } else if (tab === 'lay') {
    const L = T.all.filter(e => e.cat === 'host.layer' && e.ts < r.t1 && e.ts + e.dur > r.t0), mx = Math.max(1, ...L.map(e => e.dur));
    pane.innerHTML = `<table><tr><th>layer</th><th>phase</th><th style="width:420px">CPU · RPC · HMX · HVX · DMA · idle</th><th class="n">wall</th></tr>` + L.slice(0, 60).map(e => {
      const lm = metrics({ t0: Math.max(e.ts, r.t0), t1: Math.min(e.ts + e.dur, r.t1) });
      const ps = [['cpu', lm.cpu], ['rpc', lm.rpc], ['hmx', lm.hmxOnly], ['ovl', lm.overlap], ['hvx', lm.hvxOnly], ['dma', lm.dmaOnly], ['sync', lm.idle], ['frame', lm.other]].filter(p => p[1] > 0);
      return `<tr class="click" data-t0="${e.ts}" data-t1="${e.ts + e.dur}"><td>${e.name}</td><td class="k">${e.args && e.args.phase || ''}</td><td><span class="stack" style="width:${e.dur / mx * 100}%;min-width:30px;height:10px">${ps.map(p => `<i title="${p[0]} ${fmt(p[1])}" style="width:${p[1] / lm.wall * 100}%;background:${bg(p)}"></i>`).join('')}</span></td><td class="n">${fmt(e.dur)}</td></tr>`;
    }).join('') + '</table><p class="hint">Click a row to zoom the timeline to that layer.</p>';
    for (const tr of pane.querySelectorAll('tr.click')) tr.onclick = () => { view = { t0: +tr.dataset.t0, t1: +tr.dataset.t1 }; draw(); };
  }
}

// ---------- interaction ----------
function hit(mx, my) {
  if (!T || mx < LABEL_W) return null;
  const k = (tl.clientWidth - LABEL_W) / (view.t1 - view.t0), t = view.t0 + (mx - LABEL_W) / k;
  for (const row of T.rows) {
    if (row.kind !== 'th' || my < row.y || my >= row.y + row.h) continue;
    const d = Math.floor((my - row.y - 1) / ROW); let best = null;
    for (const e of row.th.ev) if (e._d === d && e.ts <= t && e.ts + e.dur >= t && (!best || e.dur < best.dur)) best = e;
    return best;
  }
  return null;
}
function fit() { view = { t0: T.tmin, t1: T.tmax }; draw(); }
function zoom(f, at) { const span = Math.max(10, Math.min((T.tmax - T.tmin) * 1.5, (view.t1 - view.t0) * f)); const t = at ?? (view.t0 + view.t1) / 2, r = (t - view.t0) / (view.t1 - view.t0); view.t0 = t - r * span; view.t1 = view.t0 + span; draw(); }
function pan(f) { const d = (view.t1 - view.t0) * f; view.t0 += d; view.t1 += d; draw(); }
let drag = null;
cv.addEventListener('pointerdown', ev => { drag = { x: ev.clientX, t0: view.t0, t1: view.t1, moved: false }; cv.setPointerCapture(ev.pointerId); });
cv.addEventListener('pointermove', ev => {
  const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  if (drag) { const dx = ev.clientX - drag.x; if (Math.abs(dx) > 2) drag.moved = true; const k = (tl.clientWidth - LABEL_W) / (drag.t1 - drag.t0); view.t0 = drag.t0 - dx / k; view.t1 = drag.t1 - dx / k; draw(); return; }
  const e = hit(mx, my), tip = $('#tip');
  if (!e) { tip.hidden = true; return; }
  tip.textContent = `${e._label}\n${fmt(e.dur)}  @ ${fmt(e.ts - T.tmin)}\n${e._th.name}` + Object.entries(e.args || {}).slice(0, 8).map(([k, v]) => `\n${k}: ${v}`).join('');
  tip.hidden = false; tip.style.left = Math.min(window.innerWidth - 400, ev.clientX + 12) + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
});
cv.addEventListener('pointerup', ev => { if (drag && !drag.moved) { const r = cv.getBoundingClientRect(); selected = hit(ev.clientX - r.left, ev.clientY - r.top); tab = 'sel'; renderPane(); draw(); } drag = null; });
cv.addEventListener('pointerleave', () => { $('#tip').hidden = true; });
cv.addEventListener('wheel', ev => {
  if (!ev.ctrlKey && !ev.metaKey && Math.abs(ev.deltaY) < Math.abs(ev.deltaX)) return;
  ev.preventDefault(); const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left; if (mx < LABEL_W) return;
  const k = (tl.clientWidth - LABEL_W) / (view.t1 - view.t0); zoom(Math.exp(ev.deltaY * 0.0015), view.t0 + (mx - LABEL_W) / k);
}, { passive: false });
cv.addEventListener('dblclick', fit);
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  const m = { w: () => zoom(0.7), s: () => zoom(1 / 0.7), a: () => pan(-0.1), d: () => pan(0.1), 0: fit };
  if (m[ev.key]) { ev.preventDefault(); m[ev.key](); }
});
$('#reset').onclick = fit;
$('#search').oninput = ev => { filter = ev.target.value.trim(); draw(); };
$('#color-select').onchange = ev => { colorBy = ev.target.value; draw(); renderPane(); };
$('#range-select').onchange = ev => { const v = ev.target.value; range = v === 'all' ? { t0: T.tmin, t1: T.tmax, label: 'whole trace' } : (e => ({ t0: e.ts, t1: e.ts + e.dur, label: e.name }))(T.phases[+v]); renderPane(); draw(); };
for (const b of document.querySelectorAll('.tabs button')) b.onclick = () => { tab = b.dataset.tab; renderPane(); };
$('#file').onchange = ev => { const f = ev.target.files[0]; if (!f) return; f.text().then(txt => { load(JSON.parse(txt), f.name); const o = document.createElement('option'); o.value = '__file'; o.textContent = f.name; $('#trace-select').append(o); $('#trace-select').value = '__file'; }); };
window.addEventListener('resize', () => { if (T) { resize(); draw(); } });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => draw());
new MutationObserver(() => draw()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function load(doc, label) {
  T = parse(doc); selected = null; filter = ''; $('#search').value = '';
  const md = T.md; $('#subtitle').textContent = [md.model, md.device].filter(Boolean).join(' · ') || label;
  $('#range-select').innerHTML = '<option value="all">Range: whole trace</option>' + T.phases.map((e, i) => `<option value="${i}">Range: ${e.name}</option>`).join('');
  range = { t0: T.tmin, t1: T.tmax, label: 'whole trace' };
  resize(); fit(); renderPane();
}
const EMB = JSON.parse($('#embedded-traces').textContent || '{}'), sel = $('#trace-select');
for (const k of Object.keys(EMB)) { const o = document.createElement('option'); o.value = k; o.textContent = k; sel.append(o); }
sel.onchange = () => { if (EMB[sel.value]) load(EMB[sel.value], sel.value); };
const first = Object.keys(EMB)[0];
if (first) load(EMB[first], first); else { sel.hidden = true; $('#pane').innerHTML = '<span class="hint">Load a trace.json to begin.</span>'; }
})();
</script>
