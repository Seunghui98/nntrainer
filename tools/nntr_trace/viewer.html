<title>nntr trace</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* chrome://tracing look: dense rows, pastel slices, black slice text, gray chrome */
:root {
  --bg: #ffffff; --chrome: #f3f3f3; --chrome-2: #e8e8e8; --line: #d0d0d0; --grid: #ececec;
  --ink: #202020; --ink-2: #555; --ink-3: #888; --sel: #000; --slice-ink: #000;
  --ruler: #f9f9f9; --proc: #dfe6ee; --tip-bg: #ffffe1; --tip-ink: #000; --tip-line: #999;
  --accent: #1a73e8; --ovl: rgba(26,115,232,.12);
  --cpu: #7fb3e0; --hmx: #f0a080; --hvx: #8fd4b0; --rpc: #f2d472; --dma: #b0a8e0; --sync: #cfcfcf; --frame: #9a9a9a; --wait: #f2d472; --load: #bdbdbd;
  --serious: #d9822b; --critical: #c5221f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1e1e; --chrome: #2b2b2b; --chrome-2: #333; --line: #444; --grid: #2a2a2a;
    --ink: #e6e6e6; --ink-2: #b5b5b5; --ink-3: #8a8a8a; --sel: #fff; --slice-ink: #111;
    --ruler: #262626; --proc: #33404d; --tip-bg: #3a3a30; --tip-ink: #f0f0e0; --tip-line: #666;
    --accent: #8ab4f8; --ovl: rgba(138,180,248,.15);
    --serious: #f0a35a; --critical: #f28b82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1e1e; --chrome: #2b2b2b; --chrome-2: #333; --line: #444; --grid: #2a2a2a;
  --ink: #e6e6e6; --ink-2: #b5b5b5; --ink-3: #8a8a8a; --sel: #fff; --slice-ink: #111;
  --ruler: #262626; --proc: #33404d; --tip-bg: #3a3a30; --tip-ink: #f0f0e0; --tip-line: #666;
  --accent: #8ab4f8; --ovl: rgba(138,180,248,.15);
  --serious: #f0a35a; --critical: #f28b82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 12px/1.35 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; display: flex; flex-direction: column; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
/* toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 5px 12px; background: var(--chrome); border-bottom: 1px solid var(--line); }
.bar .title { font-weight: 600; font-size: 13px; margin-right: 6px; }
.bar .sub { color: var(--ink-3); font-size: 11px; }
.bar .sp { flex: 1; }
select, input[type=text], button, label.file { font: inherit; font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; height: 24px; }
button:hover, label.file:hover { cursor: pointer; background: var(--chrome-2); }
button:focus-visible, select:focus-visible, input:focus-visible, label.file:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
label.file { display: inline-flex; align-items: center; }
label.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
/* timeline */
.tl { position: relative; flex: 1 1 auto; min-height: 260px; overflow: auto; background: var(--bg); }
.tl canvas { display: block; touch-action: none; }
#tip { position: fixed; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); border: 1px solid var(--tip-line); font-size: 11px; padding: 4px 6px; max-width: 380px; z-index: 5; white-space: pre; font-family: ui-monospace, Menlo, Consolas, monospace; }
/* analysis panel */
.panel { flex: 0 0 auto; height: 300px; min-height: 120px; max-height: 60vh; resize: vertical; overflow: auto; border-top: 1px solid var(--line); background: var(--bg); }
.tabs { display: flex; gap: 0; background: var(--chrome); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
.tabs button { border: 0; border-right: 1px solid var(--line); border-radius: 0; height: 24px; background: transparent; padding: 0 12px; }
.tabs button[aria-selected="true"] { background: var(--bg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.tabs .st { margin-left: auto; padding: 0 12px; color: var(--ink-3); align-self: center; font-size: 11px; }
.pane { padding: 8px 12px; }
table { border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 3px 10px 3px 4px; border-bottom: 1px solid var(--grid); white-space: nowrap; vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; background: var(--chrome); position: sticky; top: 24px; }
td.n, th.n { text-align: right; font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
td.k { color: var(--ink-2); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--chrome); }
.sw { display: inline-block; width: 10px; height: 10px; border: 1px solid rgba(0,0,0,.25); vertical-align: -1px; margin-right: 5px; }
.stack { display: inline-flex; height: 12px; width: 100%; max-width: 520px; border: 1px solid var(--line); overflow: hidden; vertical-align: middle; }
.stack i { display: block; height: 100%; }
.pill { font-size: 11px; padding: 0 5px; border: 1px solid; border-radius: 2px; }
.pill.bad { color: var(--serious); } .pill.crit { color: var(--critical); }
.hint { color: var(--ink-3); font-size: 11px; }
@media (max-width: 640px) { .panel { height: 220px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="bar">
  <span class="title">nntr trace</span><span class="sub" id="subtitle"></span>
  <span class="sp"></span>
  <select id="trace-select" aria-label="Trace"></select>
  <label class="file">Load<input type="file" id="file" accept=".json,application/json"></label>
  <select id="color-select" aria-label="Color slices by">
    <option value="op">Color: op</option>
    <option value="name">Color: name</option>
    <option value="engine">Color: engine</option>
  </select>
  <select id="range-select" aria-label="Analysis range"></select>
  <input type="text" id="search" placeholder="Find (name / op / layer)" aria-label="Find">
  <button id="reset" type="button" title="Fit (0)">Fit</button>
  <span class="hint">W/S zoom · A/D pan · drag pan · click select</span>
</div>
<div class="tl" id="tl"><canvas id="cv"></canvas></div>
<div class="panel" id="panel">
  <div class="tabs" role="tablist" id="tabs"><span class="st" id="range-label"></span></div>
  <div class="pane" id="pane"></div>
</div>
<div id="tip" hidden></div>

<script id="embedded-traces" type="application/json">{}</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CAT = {
  'host.cpu': 'cpu', 'host.rpc': 'rpc', 'host.wait': 'wait', 'host.layer': 'frame', 'host.phase': 'frame', 'host.load': 'load',
  'dsp.hmx': 'hmx', 'dsp.hvx': 'hvx', 'dsp.dma': 'dma', 'dsp.sync': 'sync', 'dsp.call': 'frame', 'dsp.entry': 'frame', 'qnn.op': 'cpu',
};
const LANES = ['dsp.hmx', 'dsp.hvx', 'dsp.dma'];
const BUSY_CATS = [...LANES, 'host.cpu'];
// catapult's general-purpose slice palette (color_scheme.html paletteBase), as chrome://tracing draws them
const PALETTE = ['rgb(138,113,152)','rgb(175,112,133)','rgb(127,135,225)','rgb(93,163,141)','rgb(115,138,126)','rgb(153,119,131)','rgb(93,155,213)','rgb(116,164,166)','rgb(202,134,113)','rgb(144,139,149)','rgb(155,130,150)','rgb(105,160,167)','rgb(106,151,204)','rgb(133,147,153)','rgb(120,131,206)','rgb(88,152,203)','rgb(131,134,195)','rgb(112,158,150)','rgb(90,153,138)','rgb(93,149,194)'];
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
const FONT = '11px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const ROW = 17, HDR = 22, LABEL_W = 170, PROC_H = 18, CTR_H = 30, HEAT_H = 14;
// sequential blue ramp for the units-busy strips (light: steps 100..600 of the reference palette)
const HEAT = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95'];

// ---------- state ----------
let T = null;                      // {models, rows, height, tmin (0), tmax, all, md, phases, flows}
let view = { t0: 0, t1: 1 };       // relative µs (every model is normalized to start at 0)
let selected = null, filter = '', range = null, colorBy = 'op', tab = 'sel';
const collapsed = new Set();
const cv = $('#cv'), ctx = cv.getContext('2d'), tl = $('#tl');

// ---------- model ----------
function parseEvents(doc, name) {
  const ev = doc.traceEvents || doc;
  const procs = new Map();
  const P = pid => procs.get(pid) || (procs.set(pid, { pid, name: 'pid ' + pid, sort: pid, threads: new Map() }), procs.get(pid));
  const TH = (pid, tid) => { const p = P(pid); return p.threads.get(tid) || (p.threads.set(tid, { pid, tid, name: 'tid ' + tid, sort: tid, ev: [], depth: 1 }), p.threads.get(tid)); };
  const flowMap = new Map(), counters = new Map();
  let tmin = Infinity, tmax = -Infinity;
  const push = (th, x) => { th.ev.push(x); tmin = Math.min(tmin, x.ts); tmax = Math.max(tmax, x.ts + x.dur); };
  for (const e of ev) {
    if (e.ph === 'M') {
      if (e.name === 'process_name') P(e.pid).name = e.args.name;
      else if (e.name === 'process_sort_index') P(e.pid).sort = e.args.sort_index;
      else if (e.name === 'thread_name') TH(e.pid, e.tid).name = e.args.name;
      else if (e.name === 'thread_sort_index') TH(e.pid, e.tid).sort = e.args.sort_index;
    } else if (e.ph === 'X') push(TH(e.pid, e.tid), { ...e });
    else if (e.ph === 'B' || e.ph === 'E') {
      const th = TH(e.pid, e.tid); th._st = th._st || [];
      if (e.ph === 'B') th._st.push(e); else { const b = th._st.pop(); if (b) push(th, { ...b, ph: 'X', dur: e.ts - b.ts }); }
    } else if (e.ph === 'b' || e.ph === 'e') {
      const th = TH(e.pid, e.tid); th._as = th._as || new Map();
      if (e.ph === 'b') th._as.set(e.id, e); else { const b = th._as.get(e.id); if (b) { push(th, { ...b, ph: 'X', dur: e.ts - b.ts }); th._as.delete(e.id); } }
    } else if (e.ph === 's' || e.ph === 'f') {
      const f = flowMap.get(e.id) || (flowMap.set(e.id, {}), flowMap.get(e.id)); f[e.ph] = { ...e };
    } else if (e.ph === 'C') {
      const key = e.pid + ':' + e.name;
      const c = counters.get(key) || (counters.set(key, { pid: e.pid, name: e.name, pts: [] }), counters.get(key));
      c.pts.push([e.ts, +Object.values(e.args)[0]]);
    }
  }
  if (!isFinite(tmin)) tmin = 0;
  const flows = [...flowMap.values()].filter(f => f.s && f.f);
  for (const f of flows) { f.s.ts -= tmin; f.f.ts -= tmin; }
  for (const c of counters.values()) { for (const p of c.pts) p[0] -= tmin; c.pts.sort((a, b) => a[0] - b[0]); }
  for (const p of procs.values()) for (const th of p.threads.values()) {
    for (const e of th.ev) e.ts -= tmin;
    th.ev.sort((a, b) => a.ts - b.ts || b.dur - a.dur);
    const st = []; let maxd = 0;
    th.ev.forEach((e, i) => {
      while (st.length && st[st.length - 1].ts + st[st.length - 1].dur <= e.ts + 1e-6) st.pop();
      e._d = st.length; maxd = Math.max(maxd, e._d); st.push(e);
      e._cat = CAT[e.cat] || 'sync'; e._th = th; e._i = i;
      e._op = (e.args && e.args.op) || e.name;
      e._label = e.args && e.args.op && !e.name.includes(e.args.op) ? e.args.op + ': ' + e.name : e.name;
    });
    th.depth = maxd + 1;
  }
  const plist = [...procs.values()].sort((a, b) => a.sort - b.sort);
  for (const p of plist) p.tlist = [...p.threads.values()].sort((a, b) => a.sort - b.sort);
  const all = plist.flatMap(p => p.tlist.flatMap(t => t.ev));
  const phases = all.filter(e => e.cat === 'host.phase').sort((a, b) => a.ts - b.ts);
  // W1: synthesized "units busy" strips, one per process, from a sweep over the
  // engine lanes (DSP) or the CPU slices (host).
  const heat = [];
  for (const p of plist) {
    const pev = p.tlist.flatMap(t => t.ev);
    const lanes = pev.filter(e => LANES.includes(e.cat));
    if (lanes.length) heat.push({ pid: p.pid, name: 'units busy', kind: 'heat', ...busySeries(lanes) });
    else { const cpu = pev.filter(e => e.cat === 'host.cpu'); if (cpu.length) heat.push({ pid: p.pid, name: 'threads busy', kind: 'heat', ...busySeries(cpu) }); }
  }
  return { name, procs: plist, tmin: 0, tmax: tmax - tmin, flows, counters: [...heat, ...counters.values()], md: doc.metadata || {}, phases, all };
}
function busySeries(events) {
  const edges = [];
  for (const e of events) { edges.push([e.ts, 1]); edges.push([e.ts + e.dur, -1]); }
  edges.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const pts = []; let n = 0, max = 0;
  for (let i = 0; i < edges.length; i++) {
    n += edges[i][1];
    if (i + 1 < edges.length && edges[i + 1][0] - edges[i][0] < EPS) continue; // same instant
    if (!pts.length || pts[pts.length - 1][1] !== n) pts.push([edges[i][0], n]);
    max = Math.max(max, n);
  }
  return { pts, max };
}
function counterAt(c, t) { // value of a counter at time t (step function), binary search
  const pts = c.pts; let lo = 0, hi = pts.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (pts[mid][0] <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans < 0 ? 0 : pts[ans][1];
}

function layoutRows(models) {
  const rows = []; let y = HDR;
  models.forEach((m, mi) => {
    for (const p of m.procs) {
      const pkey = mi + ':' + p.pid, pc = collapsed.has(pkey);
      rows.push({ kind: 'proc', p, m, key: pkey, y, h: PROC_H, collapsed: pc }); y += PROC_H;
      if (pc) continue;
      // heat strips first (read before the lanes), then threads, then the plain counters
      for (const c of m.counters) if (c.pid === p.pid && c.kind === 'heat') { rows.push({ kind: 'ctr', c, m, y, h: HEAT_H }); c._y = y; y += HEAT_H; }
      for (const th of p.tlist) {
        const tkey = pkey + ':' + th.tid, depth = collapsed.has(tkey) ? 1 : th.depth;
        const h = ROW * depth + 3; rows.push({ kind: 'th', th, m, key: tkey, y, h, depth }); th._y = y; th._h = h; y += h;
      }
      for (const c of m.counters) if (c.pid === p.pid && c.kind !== 'heat') { rows.push({ kind: 'ctr', c, m, y, h: CTR_H }); c._y = y; y += CTR_H; }
    }
  });
  return { rows, height: y + 6 };
}

function buildT(models) {
  const m = models[0], L = layoutRows(models);
  T = { models, rows: L.rows, height: L.height, tmin: 0, tmax: Math.max(...models.map(x => x.tmax)), all: m.all, md: m.md, phases: m.phases, flows: m.flows, procs: m.procs };
}
function relayout() { const L = layoutRows(T.models); T.rows = L.rows; T.height = L.height; resize(); draw(); }

// ---------- interval math ----------
function union(iv) { iv = iv.filter(x => x[1] > x[0]).sort((a, b) => a[0] - b[0]); const o = []; for (const x of iv) { const l = o[o.length - 1]; if (l && x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else o.push([x[0], x[1]]); } return o; }
const len = iv => iv.reduce((s, x) => s + x[1] - x[0], 0);
const EPS = 1e-6; // µs; slices are written with 3 decimals, so anything below this is float residue
function inter(a, b) { const o = []; let i = 0, j = 0; while (i < a.length && j < b.length) { const lo = Math.max(a[i][0], b[j][0]), hi = Math.min(a[i][1], b[j][1]); if (hi > lo + EPS) o.push([lo, hi]); if (a[i][1] < b[j][1]) i++; else j++; } return o; }
function minus(a, b) { const o = []; for (const [x0, x1] of a) { let c = x0; for (const [y0, y1] of b) { if (y1 <= c + EPS) continue; if (y0 >= x1 - EPS) break; if (y0 > c + EPS) o.push([c, y0]); c = Math.max(c, y1); } if (c < x1 - EPS) o.push([c, x1]); } return o; }
const clip = (e, r) => [Math.max(e.ts, r.t0), Math.min(e.ts + e.dur, r.t1)];
const inRange = (e, r) => e.ts < r.t1 && e.ts + e.dur > r.t0;
const spans = (pred, r, all = T.all) => union(all.filter(e => pred(e) && inRange(e, r)).map(e => clip(e, r)));
const fmt = us => us >= 1000 ? (us / 1000).toFixed(3) + ' ms' : us.toFixed(3) + ' µs';
const pct = x => (x * 100).toFixed(1) + '%';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// ---------- metrics ----------
function metrics(r, all = T.all) {
  const wall = r.t1 - r.t0;
  const hmx = spans(e => e.cat === 'dsp.hmx', r, all), hvx = spans(e => e.cat === 'dsp.hvx', r, all), dma = spans(e => e.cat === 'dsp.dma', r, all);
  const entry = spans(e => e.cat === 'dsp.entry', r, all), any = union([...hmx, ...hvx, ...dma]);
  const rpc = spans(e => e.cat === 'host.rpc', r, all), cpu = spans(e => e.cat === 'host.cpu', r, all), load = spans(e => e.cat === 'host.load', r, all);
  const overlap = inter(hmx, hvx), idle = minus(entry, any);
  const other = wall - len(union([...cpu, ...rpc, ...any, ...idle, ...load]));
  const occ = [];
  const threads = new Set(all.map(e => e._th));
  for (const th of threads) {
    const c = th.ev.find(e => BUSY_CATS.includes(e.cat)); if (!c) continue;
    occ.push({ th, cat: c._cat, busy: len(spans(e => e._th === th && BUSY_CATS.includes(e.cat), r, all)) / wall });
  }
  occ.sort((a, b) => a.th.pid - b.th.pid || a.th.sort - b.th.sort);
  return { wall, cpu: len(cpu), rpc: len(rpc), hmxOnly: len(minus(hmx, hvx)), hvxOnly: len(minus(hvx, hmx)), overlap: len(overlap), dmaOnly: len(minus(dma, union([...hmx, ...hvx]))), idle: len(idle), load: len(load), other: Math.max(0, other), any: len(any), entry: len(entry), compression: len(any) ? (len(hmx) + len(hvx) + len(dma)) / len(any) : 0, occ };
}
function kernels(r, all = T.all, md = T.md) {
  const m = new Map(), mhz = md.dsp_clock_mhz || 1200;
  for (const e of all) {
    if (!e.args || !e.args.engine || !e.args.elems || !['dsp.hmx', 'dsp.hvx'].includes(e.cat) || !inRange(e, r)) continue;
    const k = e.args.engine + '|' + e._label, row = m.get(k) || (m.set(k, { engine: e.args.engine, name: e._label, n: 0, us: 0, elems: 0, cyc: 0 }), m.get(k));
    row.n++; row.us += e.dur; row.elems += e.args.elems; row.cyc += e.args.cycles || 0;
  }
  return [...m.values()].map(k => ({ ...k, cpe: (k.cyc || k.us * mhz) / k.elems })).sort((a, b) => b.us - a.us);
}
function layerRows(r, all = T.all) {
  return all.filter(e => e.cat === 'host.layer' && inRange(e, r)).map(e => ({ e, m: metrics({ t0: Math.max(e.ts, r.t0), t1: Math.min(e.ts + e.dur, r.t1) }, all) }));
}
function metricsJSON(r = range) {
  const m = metrics(r);
  return {
    schema: 'nntr_trace.metrics.v1', range: { label: r.label, t0_us: r.t0, t1_us: r.t1 }, wall_us: m.wall,
    buckets: { cpu: m.cpu, rpc: m.rpc, hmx_only: m.hmxOnly, overlap: m.overlap, hvx_only: m.hvxOnly, dma_only: m.dmaOnly, dsp_idle: m.idle, load: m.load, other: m.other },
    compression: m.compression, idle_ratio: m.entry ? m.idle / m.entry : 0,
    engines: m.occ.map(o => ({ track: o.th.name, busy: o.busy })),
    kernels: kernels(r).map(k => ({ engine: k.engine, name: k.name, calls: k.n, total_us: k.us, mean_us: k.us / k.n, elems: k.elems, cy_per_elem: k.cpe })),
    layers: layerRows(r).map(({ e, m }) => ({ name: e.name, phase: e.args && e.args.phase || null, wall_us: e.dur, cpu: m.cpu, rpc: m.rpc, hmx_only: m.hmxOnly, overlap: m.overlap, hvx_only: m.hvxOnly, dma_only: m.dmaOnly, dsp_idle: m.idle })),
  };
}

// ---------- colors ----------
function sliceColor(e) {
  if (colorBy === 'engine') return css('--' + (e._cat === 'frame' ? 'frame' : e._cat));
  return PALETTE[hash(colorBy === 'op' ? e._op : e.name) % PALETTE.length];
}

// ---------- draw ----------
function resize() {
  const w = tl.clientWidth || 800, dpr = window.devicePixelRatio || 1;
  cv.style.width = w + 'px'; cv.style.height = T.height + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(T.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
